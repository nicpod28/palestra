<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<title>Palestra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone/icona-192.png">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palestra">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --sfondo: #f4f5f7; --carta: #ffffff; --testo: #111418; --tenue: #4d5560;
    --bordo: #c9ced6; --accento: #0b57d0; --su-accento: #ffffff;
    --pericolo: #b3261e; --su-pericolo: #ffffff; --evidenza: #e3ecfb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sfondo: #0e0f12; --carta: #1b1d22; --testo: #f2f3f5; --tenue: #b4bac4;
      --bordo: #474c55; --accento: #8ab4f8; --su-accento: #0a1a33;
      --pericolo: #ffb4ab; --su-pericolo: #4a0d08; --evidenza: #22304a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--sfondo); color: var(--testo);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--sfondo);
    display: flex; align-items: center; gap: 4px;
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
    border-bottom: 1px solid var(--bordo);
  }
  header h1 { font-size: 20px; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .indietro {
    min-width: 48px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--testo); border-radius: 12px;
  }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 16px; margin: 20px 4px 8px; color: var(--tenue); text-transform: uppercase; letter-spacing: .04em; }
  p { margin: 8px 4px; }
  .tenue { color: var(--tenue); }
  .carta { background: var(--carta); border: 1px solid var(--bordo); border-radius: 14px; padding: 12px; margin: 0 0 12px; }

  /* Liste di righe toccabili */
  ul.lista { list-style: none; margin: 0 0 12px; padding: 0; }
  .riga {
    display: flex; align-items: stretch; gap: 6px; background: var(--carta);
    border: 1px solid var(--bordo); border-radius: 14px; margin-bottom: 8px; padding: 6px;
  }
  .riga-corpo {
    flex: 1; min-width: 0; min-height: 48px; display: flex; flex-direction: column; justify-content: center;
    padding: 4px 8px; color: var(--testo); text-decoration: none; overflow-wrap: anywhere;
  }
  .riga-corpo small { color: var(--tenue); font-size: 14px; }
  .etichetta-attiva {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--accento); color: var(--su-accento); margin-left: 6px; vertical-align: middle;
  }

  /* Pulsanti */
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn {
    min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--bordo);
    background: var(--carta); color: var(--testo); font-weight: 600; width: 100%; margin-bottom: 8px;
  }
  .btn.primario { background: var(--accento); color: var(--su-accento); border-color: var(--accento); }
  .btn.pericolo { color: var(--pericolo); border-color: var(--pericolo); }
  .btn.pericolo.pieno { background: var(--pericolo); color: var(--su-pericolo); }
  .icona {
    min-width: 48px; min-height: 48px; border-radius: 12px; border: 1px solid var(--bordo);
    background: var(--sfondo); font-size: 20px; font-weight: 700; padding: 0;
  }
  .icona:disabled { opacity: .3; }
  .icona.pericolo { color: var(--pericolo); }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--accento); outline-offset: 2px;
  }

  /* Campi */
  label { display: block; font-size: 14px; font-weight: 600; color: var(--tenue); margin: 10px 2px 4px; }
  input[type=text], textarea {
    width: 100%; min-height: 48px; padding: 10px 12px; font: inherit; color: var(--testo);
    background: var(--sfondo); border: 1px solid var(--bordo); border-radius: 12px;
  }
  textarea { min-height: 80px; resize: vertical; }
  .in-linea { display: flex; gap: 8px; align-items: end; }
  .in-linea > div { flex: 1; min-width: 0; }
  .in-linea > div.stretto { flex: 0 0 84px; }
  .serie-riga { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .serie-riga span { flex: 0 0 68px; font-weight: 600; }
  .serie-riga input { flex: 1; min-width: 0; }
  .suggerimenti { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .suggerimenti button {
    min-height: 48px; text-align: left; padding: 8px 12px; border-radius: 12px;
    border: 1px dashed var(--accento); background: var(--evidenza); color: var(--testo);
  }
  .suggerimenti small { display: block; color: var(--tenue); font-size: 13px; }

  /* Barra in basso */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex;
    background: var(--carta); border-top: 1px solid var(--bordo);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav a {
    flex: 1; min-height: 60px; display: flex; align-items: center; justify-content: center;
    text-decoration: none; color: var(--tenue); font-weight: 600; font-size: 15px;
    border-top: 3px solid transparent;
  }
  nav a[aria-current=page] { color: var(--accento); border-top-color: var(--accento); }

  /* Finestra di conferma e avvisi */
  .velo {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55);
    display: flex; align-items: flex-end; justify-content: center; padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  .finestra {
    background: var(--carta); color: var(--testo); border-radius: 16px; padding: 16px;
    width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; border: 1px solid var(--bordo);
  }
  .finestra h3 { margin: 0 0 8px; font-size: 19px; }
  .finestra .btn { margin-top: 8px; margin-bottom: 0; }
  .btn-file { display: flex; align-items: center; justify-content: center; font-size: inherit; color: var(--testo); margin: 8px 0; }
  .allarme { border: 2px solid var(--pericolo); }
  .allarme strong { color: var(--pericolo); }
  a.carta { display: block; color: var(--testo); text-decoration: none; min-height: 48px; }
  .errori { border-color: var(--pericolo); }
  .errori strong { color: var(--pericolo); }
  .errori ul { margin: 8px 0 0; padding-left: 20px; }
  .errori li { margin-bottom: 6px; overflow-wrap: anywhere; }
  .anteprima h3 { margin: 14px 0 4px; font-size: 17px; }
  .anteprima ul { margin: 0; padding-left: 20px; }
  .anteprima li { margin-bottom: 6px; overflow-wrap: anywhere; }
  .anteprima small { color: var(--tenue); display: block; }
  .nuovo { font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--accento); color: var(--accento); margin-left: 4px; white-space: nowrap; }
  #avviso {
    position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 30;
    background: var(--testo); color: var(--sfondo); padding: 12px 14px; border-radius: 12px;
    font-weight: 600; text-align: center; max-width: 616px; margin: 0 auto;
  }
  #avviso.errore { background: var(--pericolo); color: var(--su-pericolo); }
  #avviso[hidden] { display: none; }
  #aggiorna { margin: 12px 12px 0; width: calc(100% - 24px); max-width: 616px; }
  #aggiorna[hidden] { display: none; }
  @media (min-width: 640px) { #aggiorna { display: block; margin-left: auto; margin-right: auto; } }
</style>
</head>
<body>
<header id="testata"></header>
<button id="aggiorna" class="btn primario" hidden>Nuova versione disponibile, tocca per aggiornare</button>
<main id="vista"></main>
<nav id="barra" aria-label="Sezioni">
  <a href="#allenamento" data-tab="allenamento">Allenamento</a>
  <a href="#scheda" data-tab="scheda">Scheda</a>
  <a href="#dati" data-tab="dati">Dati</a>
</nav>
<div id="avviso" role="status" aria-live="polite" hidden></div>

<script>
'use strict';

/* ====================================================================
   PARTE 1: LOGICA DEI DATI
   Nessuna di queste funzioni tocca la pagina: solo dati e salvataggio.
   ==================================================================== */

const CHIAVE = 'palestra.dati';
const CHIAVE_ILLEGGIBILI = 'palestra.datiIlleggibili';
const CHIAVE_COPIA = 'palestra.copiaPrecedente';
const GIORNI_AVVISO_BACKUP = 14;
const VERSIONE = 1;
const MAX_SERIE = 20;

let dati = null;          // tutti i dati dell'app
let erroreCaricamento = null; // 'illeggibili' | 'futuro' | null

function datiVuoti() {
  return {
    schemaVersion: VERSIONE,
    ultimoBackup: null,
    schedaAttivaId: null,
    catalogo: [],
    schede: [],
    allenamenti: []
  };
}

// Migrazioni future: la funzione alla chiave N porta i dati dalla versione N alla N+1.
const MIGRAZIONI = {
  // 1: function (d) { ...modifiche...; d.schemaVersion = 2; return d; }
};

function migra(d) {
  if (!d || typeof d !== 'object' || typeof d.schemaVersion !== 'number') throw new Error('illeggibili');
  if (d.schemaVersion > VERSIONE) throw new Error('futuro');
  while (d.schemaVersion < VERSIONE) {
    const passo = MIGRAZIONI[d.schemaVersion];
    if (!passo) throw new Error('illeggibili');
    d = passo(d);
  }
  return d;
}

function carica() {
  erroreCaricamento = null;
  let testo = null;
  try { testo = localStorage.getItem(CHIAVE); } catch (e) { /* memoria non accessibile */ }
  if (testo === null) { dati = datiVuoti(); return; }
  try {
    dati = migra(JSON.parse(testo));
  } catch (e) {
    // Non sovrascrivo mai dati che non so leggere.
    dati = null;
    erroreCaricamento = e.message === 'futuro' ? 'futuro' : 'illeggibili';
  }
}

// Salva subito. Restituisce false se il telefono rifiuta la scrittura.
function salva() {
  if (!dati) return false;
  try {
    localStorage.setItem(CHIAVE, JSON.stringify(dati));
    return true;
  } catch (e) {
    return false;
  }
}

// Mette da parte i dati illeggibili e riparte da zero.
function ripartiDaZero() {
  try {
    const vecchi = localStorage.getItem(CHIAVE);
    if (vecchi !== null) localStorage.setItem(CHIAVE_ILLEGGIBILI, vecchi);
  } catch (e) { /* niente da fare */ }
  dati = datiVuoti();
  erroreCaricamento = null;
  return salva();
}

let contatoreId = 0;
function nuovoId(prefisso) {
  contatoreId = (contatoreId + 1) % 1296;
  return prefisso + '_' + Date.now().toString(36) + contatoreId.toString(36) + Math.random().toString(36).slice(2, 5);
}

// Toglie spazi all'inizio, alla fine e doppi.
function pulisciTesto(t) {
  return String(t == null ? '' : t).replace(/\s+/g, ' ').trim();
}

// Forma usata per confrontare i nomi: senza maiuscole né spazi in eccesso.
function normalizzaNome(t) {
  return pulisciTesto(t).toLowerCase();
}

// Numero intero tra min e max, oppure null se il testo non è valido.
function leggiIntero(testo, min, max) {
  const t = String(testo == null ? '' : testo).trim();
  if (!/^\d+$/.test(t)) return null;
  const n = Number(t);
  return n >= min && n <= max ? n : null;
}

function sposta(lista, indice, direzione) {
  const altro = indice + direzione;
  if (indice < 0 || altro < 0 || altro >= lista.length) return false;
  const tmp = lista[indice]; lista[indice] = lista[altro]; lista[altro] = tmp;
  return true;
}

/* ---- Catalogo esercizi ---- */

function esercizioPerId(id) {
  return dati.catalogo.find(function (e) { return e.id === id; }) || null;
}

function esercizioPerNome(nome) {
  const n = normalizzaNome(nome);
  return dati.catalogo.find(function (e) { return normalizzaNome(e.nome) === n; }) || null;
}

function nomeEsercizio(id) {
  const e = esercizioPerId(id);
  return e ? e.nome : '(esercizio sconosciuto)';
}

// Restituisce l'esercizio del catalogo con quel nome; se manca lo crea.
function ottieniOCreaEsercizio(nome) {
  const esistente = esercizioPerNome(nome);
  if (esistente) return esistente;
  const nuovo = { id: nuovoId('es'), nome: pulisciTesto(nome) };
  dati.catalogo.push(nuovo);
  return nuovo;
}

// Nomi del catalogo che somigliano al testo scritto (prima quelli che iniziano uguale).
function suggerisciEsercizi(testo) {
  const n = normalizzaNome(testo);
  if (!n) return [];
  const trovati = dati.catalogo.filter(function (e) { return normalizzaNome(e.nome).indexOf(n) !== -1; });
  trovati.sort(function (a, b) {
    const ia = normalizzaNome(a.nome).indexOf(n) === 0 ? 0 : 1;
    const ib = normalizzaNome(b.nome).indexOf(n) === 0 ? 0 : 1;
    return ia - ib || a.nome.localeCompare(b.nome, 'it');
  });
  return trovati.slice(0, 6);
}

// Toglie dal catalogo gli esercizi che nessuna scheda e nessun allenamento usa più.
function pulisciCatalogo() {
  const usati = {};
  dati.schede.forEach(function (s) {
    s.giorni.forEach(function (g) {
      g.esercizi.forEach(function (v) { usati[v.esercizioId] = true; });
    });
  });
  dati.allenamenti.forEach(function (a) {
    (a.esercizi || []).forEach(function (v) { usati[v.esercizioId] = true; });
  });
  dati.catalogo = dati.catalogo.filter(function (e) { return usati[e.id]; });
}

/* ---- Schede ---- */

function schedaPerId(id) {
  return dati.schede.find(function (s) { return s.id === id; }) || null;
}

function creaScheda(nome) {
  const scheda = { id: nuovoId('sch'), nome: pulisciTesto(nome), creataIl: new Date().toISOString(), giorni: [] };
  dati.schede.push(scheda);
  // La prima scheda diventa attiva da sola.
  if (!schedaPerId(dati.schedaAttivaId)) dati.schedaAttivaId = scheda.id;
  salva();
  return scheda;
}

function rinominaScheda(scheda, nome) { scheda.nome = pulisciTesto(nome); salva(); }

function attivaScheda(scheda) { dati.schedaAttivaId = scheda.id; salva(); }

function cancellaScheda(scheda) {
  dati.schede = dati.schede.filter(function (s) { return s.id !== scheda.id; });
  if (dati.schedaAttivaId === scheda.id) dati.schedaAttivaId = null;
  pulisciCatalogo();
  salva();
}

/* ---- Giorni ---- */

function giornoPerId(scheda, id) {
  return scheda.giorni.find(function (g) { return g.id === id; }) || null;
}

function creaGiorno(scheda, nome) {
  const giorno = { id: nuovoId('gio'), nome: pulisciTesto(nome), esercizi: [] };
  scheda.giorni.push(giorno);
  salva();
  return giorno;
}

function rinominaGiorno(giorno, nome) { giorno.nome = pulisciTesto(nome); salva(); }

function cancellaGiorno(scheda, giorno) {
  scheda.giorni = scheda.giorni.filter(function (g) { return g.id !== giorno.id; });
  pulisciCatalogo();
  salva();
}

function spostaGiorno(scheda, giornoId, direzione) {
  const i = scheda.giorni.findIndex(function (g) { return g.id === giornoId; });
  if (sposta(scheda.giorni, i, direzione)) salva();
}

/* ---- Esercizi di un giorno ("voci") e serie ---- */

function vocePerId(giorno, id) {
  return giorno.esercizi.find(function (v) { return v.id === id; }) || null;
}

function serieUguali(numero, ripetizioni) {
  const serie = [];
  for (let i = 0; i < numero; i++) serie.push({ ripetizioni: ripetizioni });
  return serie;
}

function aggiungiVoce(giorno, nome, numeroSerie, ripetizioni) {
  const voce = {
    id: nuovoId('ve'),
    esercizioId: ottieniOCreaEsercizio(nome).id,
    recupero: '',
    nota: '',
    serie: serieUguali(numeroSerie, pulisciTesto(ripetizioni))
  };
  giorno.esercizi.push(voce);
  salva();
  return voce;
}

function cambiaEsercizioVoce(voce, nome) {
  voce.esercizioId = ottieniOCreaEsercizio(nome).id;
  pulisciCatalogo();
  salva();
}

function cancellaVoce(giorno, voce) {
  giorno.esercizi = giorno.esercizi.filter(function (v) { return v.id !== voce.id; });
  pulisciCatalogo();
  salva();
}

function spostaVoce(giorno, voceId, direzione) {
  const i = giorno.esercizi.findIndex(function (v) { return v.id === voceId; });
  if (sposta(giorno.esercizi, i, direzione)) salva();
}

function generaSerie(voce, numero, ripetizioni) {
  voce.serie = serieUguali(numero, pulisciTesto(ripetizioni));
  salva();
}

function aggiungiSerie(voce) {
  const ultima = voce.serie[voce.serie.length - 1];
  voce.serie.push({ ripetizioni: ultima ? ultima.ripetizioni : '' });
  salva();
}

function togliSerie(voce, indice) { voce.serie.splice(indice, 1); salva(); }

function modificaSerie(voce, indice, ripetizioni) {
  if (!voce.serie[indice]) return;
  voce.serie[indice].ripetizioni = String(ripetizioni).trim();
  salva();
}

function modificaCampoVoce(voce, campo, valore) {
  if (campo !== 'recupero' && campo !== 'nota') return;
  voce[campo] = String(valore).trim();
  salva();
}

// True se tutte le serie hanno le stesse ripetizioni.
function serieTutteUguali(voce) {
  return voce.serie.every(function (s) { return s.ripetizioni === voce.serie[0].ripetizioni; });
}

// Riassunto breve: "4 × 8-10" oppure "12 / 10 / 8 / 6".
function riassuntoSerie(voce) {
  if (!voce.serie.length) return 'nessuna serie';
  if (serieTutteUguali(voce)) return voce.serie.length + ' × ' + (voce.serie[0].ripetizioni || '?');
  return voce.serie.map(function (s) { return s.ripetizioni || '?'; }).join(' / ');
}

/* ---- Date ---- */

function dueCifre(n) { return (n < 10 ? '0' : '') + n; }

function dataValida(t) { return typeof t === 'string' && !isNaN(Date.parse(t)); }

// gg/mm/aaaa
function formattaData(iso) {
  const d = new Date(iso);
  return dueCifre(d.getDate()) + '/' + dueCifre(d.getMonth() + 1) + '/' + d.getFullYear();
}

function formattaDataOra(iso) {
  const d = new Date(iso);
  return formattaData(iso) + ' alle ' + dueCifre(d.getHours()) + ':' + dueCifre(d.getMinutes());
}

// Giorni di calendario passati da una data a oggi.
function giorniDa(iso, adesso) {
  const a = new Date(iso), b = adesso || new Date();
  const g1 = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const g2 = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((g2 - g1) / 86400000);
}

/* ---- Backup completo ---- */

function nomeFileBackup(data) {
  return 'palestra-backup-' + data.getFullYear() + '-' + dueCifre(data.getMonth() + 1) + '-' + dueCifre(data.getDate()) + '.json';
}

function testoBackup() { return JSON.stringify(dati, null, 2); }

function contaDati(d) {
  return plurale(d.schede.length, 'scheda', 'schede') + ', ' + plurale(d.allenamenti.length, 'allenamento', 'allenamenti') +
    ', ' + plurale(d.catalogo.length, 'esercizio', 'esercizi') + ' nel catalogo';
}

// Stato dell'ultimo backup: testo da mostrare e se va evidenziato.
function statoBackup() {
  if (!dati.ultimoBackup) {
    return { testo: 'Ultimo backup: mai fatto', scaduto: dati.schede.length > 0 || dati.allenamenti.length > 0 };
  }
  const g = giorniDa(dati.ultimoBackup);
  const quando = g <= 0 ? 'oggi' : g === 1 ? 'ieri' : g + ' giorni fa';
  return { testo: 'Ultimo backup: ' + formattaData(dati.ultimoBackup) + ' (' + quando + ')', scaduto: g > GIORNI_AVVISO_BACKUP };
}

// Controlla che un oggetto sia un backup completo e coerente.
// Restituisce { errori: [testi], dati: dati pronti da usare oppure null }.
function validaBackup(o) {
  if (!eOggetto(o)) return { errori: ['Il file non contiene un backup di Palestra (trovato: ' + mostraValore(o) + ').'], dati: null };
  if (typeof o.schemaVersion !== 'number') {
    return { errori: ['Manca il campo "schemaVersion": questo file non è un backup di Palestra.' +
      (Array.isArray(o.giorni) ? ' Sembra una scheda: importala da Scheda → Importa scheda da JSON.' : '')], dati: null };
  }
  if (o.schemaVersion > VERSIONE) {
    return { errori: ['Questo backup è stato creato da una versione più recente dell\'app (formato ' + o.schemaVersion +
      ', questa app arriva al formato ' + VERSIONE + '). Aggiorna l\'app e riprova.'], dati: null };
  }
  let d;
  try { d = migra(JSON.parse(JSON.stringify(o))); }
  catch (e) { return { errori: ['Non riesco ad aggiornare questo backup al formato attuale.'], dati: null }; }

  const errori = [];
  function err(m) { if (errori.length < 15) errori.push(m); }
  function testo(v) { return typeof v === 'string'; }
  function pieno(v) { return typeof v === 'string' && v.trim() !== ''; }

  ['catalogo', 'schede', 'allenamenti'].forEach(function (campo) {
    if (!Array.isArray(d[campo])) err('Il campo "' + campo + '" manca o non è una lista.');
  });
  if (errori.length) return { errori: errori, dati: null };

  const idCatalogo = {};
  d.catalogo.forEach(function (e, i) {
    const dove = 'Catalogo, esercizio ' + (i + 1);
    if (!eOggetto(e) || !pieno(e.id) || !pieno(e.nome)) return err(dove + ': servono "id" e "nome" come testi non vuoti.');
    if (idCatalogo[e.id]) err(dove + ' ("' + e.nome + '"): "id" ripetuto.');
    idCatalogo[e.id] = true;
  });

  const idSchede = {};
  d.schede.forEach(function (s, i) {
    let dove = 'Scheda ' + (i + 1);
    if (!eOggetto(s) || !pieno(s.id) || !pieno(s.nome)) return err(dove + ': servono "id" e "nome" come testi non vuoti.');
    dove += ' ("' + s.nome + '")';
    idSchede[s.id] = true;
    if (!Array.isArray(s.giorni)) return err(dove + ': il campo "giorni" manca o non è una lista.');
    s.giorni.forEach(function (g, j) {
      let doveG = dove + ', giorno ' + (j + 1);
      if (!eOggetto(g) || !pieno(g.id) || !pieno(g.nome)) return err(doveG + ': servono "id" e "nome" come testi non vuoti.');
      doveG += ' ("' + g.nome + '")';
      if (!Array.isArray(g.esercizi)) return err(doveG + ': il campo "esercizi" manca o non è una lista.');
      g.esercizi.forEach(function (v, k) {
        const doveV = doveG + ', esercizio ' + (k + 1);
        if (!eOggetto(v) || !pieno(v.id)) return err(doveV + ': manca "id".');
        if (!idCatalogo[v.esercizioId]) return err(doveV + ': "esercizioId" non corrisponde a nessun esercizio del catalogo.');
        if (!Array.isArray(v.serie) || !v.serie.every(function (x) { return eOggetto(x) && testo(x.ripetizioni); })) {
          return err(doveV + ': "serie" deve essere una lista di oggetti con il testo "ripetizioni".');
        }
        if (!testo(v.recupero)) v.recupero = '';
        if (!testo(v.nota)) v.nota = '';
      });
    });
  });

  if (d.schedaAttivaId !== null && d.schedaAttivaId !== undefined && !idSchede[d.schedaAttivaId]) {
    err('"schedaAttivaId" indica una scheda che nel backup non esiste.');
  }
  if (d.schedaAttivaId === undefined) d.schedaAttivaId = null;
  if (!dataValida(d.ultimoBackup)) d.ultimoBackup = null;

  let inCorso = 0;
  d.allenamenti.forEach(function (a, i) {
    const dove = 'Allenamento ' + (i + 1);
    if (!eOggetto(a) || !pieno(a.id)) return err(dove + ': manca "id".');
    if (a.stato !== 'in_corso' && a.stato !== 'completato') return err(dove + ': "stato" deve essere "in_corso" oppure "completato" (trovato: ' + mostraValore(a.stato) + ').');
    if (a.stato === 'in_corso') inCorso++;
    if (!dataValida(a.inizio)) return err(dove + ': "inizio" non è una data valida.');
    if (a.stato === 'completato' && !dataValida(a.fine)) return err(dove + ': è completato ma "fine" non è una data valida.');
    if (!Array.isArray(a.esercizi)) return err(dove + ': il campo "esercizi" manca o non è una lista.');
    a.esercizi.forEach(function (v, k) {
      const doveV = dove + ', esercizio ' + (k + 1);
      if (!eOggetto(v) || !pieno(v.esercizioId) || !pieno(v.nome)) return err(doveV + ': servono "esercizioId" e "nome".');
      if (!Array.isArray(v.serie)) return err(doveV + ': il campo "serie" manca o non è una lista.');
      v.serie.forEach(function (x, n) {
        const doveS = doveV + ', serie ' + (n + 1);
        if (!eOggetto(x)) return err(doveS + ': deve essere un oggetto.');
        if (x.carico !== null && !(typeof x.carico === 'number' && isFinite(x.carico) && x.carico >= 0)) {
          return err(doveS + ': "carico" deve essere un numero non negativo oppure vuoto (trovato: ' + mostraValore(x.carico) + ').');
        }
        if (x.ripetizioni !== null && !(typeof x.ripetizioni === 'number' && x.ripetizioni >= 0 && Math.floor(x.ripetizioni) === x.ripetizioni)) {
          return err(doveS + ': "ripetizioni" deve essere un numero intero non negativo oppure vuoto (trovato: ' + mostraValore(x.ripetizioni) + ').');
        }
        if (typeof x.fatta !== 'boolean') return err(doveS + ': "fatta" deve essere true oppure false.');
        if (!testo(x.target)) x.target = '';
        if (!testo(x.commento)) x.commento = '';
      });
    });
  });
  if (inCorso > 1) err('Il backup contiene ' + inCorso + ' allenamenti in corso: ne può esistere uno solo.');

  return { errori: errori, dati: errori.length ? null : d };
}

function analizzaTestoBackup(testo) {
  const t = String(testo == null ? '' : testo).replace(/^﻿/, '').trim();
  if (!t) return { errori: ['Il file è vuoto.'], dati: null };
  let oggetto;
  try { oggetto = JSON.parse(t); }
  catch (e) { return { errori: ['Il file non è un JSON valido: potrebbe essere danneggiato o non essere un backup. (Dettaglio tecnico: ' + e.message + ')'], dati: null }; }
  return validaBackup(oggetto);
}

/* ---- Copia precedente (fatta prima di sostituire o cancellare tutto) ---- */

function leggiCopia() {
  try {
    const c = JSON.parse(localStorage.getItem(CHIAVE_COPIA));
    if (!c || !dataValida(c.salvataIl)) return null;
    c.dati = migra(c.dati);
    return Array.isArray(c.dati.schede) && Array.isArray(c.dati.allenamenti) && Array.isArray(c.dati.catalogo) ? c : null;
  } catch (e) { return null; }
}

function conservaCopia() {
  try {
    localStorage.setItem(CHIAVE_COPIA, JSON.stringify({ salvataIl: new Date().toISOString(), dati: dati }));
    return true;
  } catch (e) { return false; }
}

// Sostituisce tutti i dati, tenendo da parte quelli attuali. False se non c'è spazio per la copia.
function sostituisciDati(nuovi) {
  if (!conservaCopia()) return false;
  const vecchi = dati;
  dati = nuovi;
  if (salva()) return true;
  dati = vecchi;
  return false;
}

function cancellaTutto() { return sostituisciDati(datiVuoti()); }

// Scambia i dati attuali con la copia precedente (così anche il ripristino è annullabile).
function ripristinaCopia() {
  const copia = leggiCopia();
  return copia ? sostituisciDati(copia.dati) : false;
}

/* ---- Importazione di una scheda da JSON (formato in FORMATO-SCHEDA.md) ---- */

const LIMITI = { nome: 80, ripetizioni: 20, recupero: 30, nota: 300 };

// Mostra un valore sbagliato dentro un messaggio d'errore, accorciato.
function mostraValore(v) {
  let t;
  try { t = JSON.stringify(v); } catch (e) { t = String(v); }
  if (t === undefined) t = 'niente';
  return t.length > 40 ? t.slice(0, 40) + '…' : t;
}

// Testo o numero diventano testo pulito; qualsiasi altra cosa diventa null.
function comeTesto(v) {
  if (typeof v === 'string') return pulisciTesto(v);
  if (typeof v === 'number' && isFinite(v)) return String(v);
  return null;
}

function eOggetto(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }

// Controlla un oggetto nel formato d'importazione.
// Restituisce { errori: [testi], scheda: versione ripulita oppure null }.
function validaSchedaImportata(o) {
  const errori = [];
  if (!eOggetto(o)) {
    return { errori: ['Il JSON deve essere un oggetto { ... } con i campi "nome" e "giorni" (trovato: ' + mostraValore(o) + ').'], scheda: null };
  }

  // Legge un campo di testo obbligatorio o facoltativo e segnala i problemi.
  function campoTesto(valore, campo, dove, limite, obbligatorio) {
    if (valore === undefined || valore === null) {
      if (obbligatorio) errori.push(dove + ': manca il campo "' + campo + '".');
      return '';
    }
    const t = comeTesto(valore);
    if (t === null) { errori.push(dove + ': il campo "' + campo + '" deve essere un testo (trovato: ' + mostraValore(valore) + ').'); return ''; }
    if (!t && obbligatorio) { errori.push(dove + ': il campo "' + campo + '" è vuoto.'); return ''; }
    if (t.length > limite) { errori.push(dove + ': il campo "' + campo + '" è troppo lungo (massimo ' + limite + ' caratteri).'); return ''; }
    return t;
  }

  const scheda = { nome: campoTesto(o.nome, 'nome', 'Scheda', LIMITI.nome, true), giorni: [] };

  if (o.giorni === undefined || o.giorni === null) errori.push('Scheda: manca il campo "giorni".');
  else if (!Array.isArray(o.giorni)) errori.push('Scheda: il campo "giorni" deve essere una lista [ ... ] (trovato: ' + mostraValore(o.giorni) + ').');
  else if (!o.giorni.length) errori.push('Scheda: la lista "giorni" è vuota, serve almeno un giorno.');
  else o.giorni.forEach(function (g, i) {
    let dove = 'Giorno ' + (i + 1);
    if (!eOggetto(g)) { errori.push(dove + ': deve essere un oggetto { ... } (trovato: ' + mostraValore(g) + ').'); return; }
    const giorno = { nome: campoTesto(g.nome, 'nome', dove, LIMITI.nome, true), esercizi: [] };
    if (giorno.nome) dove += ' ("' + giorno.nome + '")';
    scheda.giorni.push(giorno);

    if (g.esercizi === undefined || g.esercizi === null) { errori.push(dove + ': manca il campo "esercizi".'); return; }
    if (!Array.isArray(g.esercizi)) { errori.push(dove + ': il campo "esercizi" deve essere una lista [ ... ] (trovato: ' + mostraValore(g.esercizi) + ').'); return; }

    g.esercizi.forEach(function (e, j) {
      let qui = dove + ', esercizio ' + (j + 1);
      if (!eOggetto(e)) { errori.push(qui + ': deve essere un oggetto { ... } (trovato: ' + mostraValore(e) + ').'); return; }
      const es = { nome: campoTesto(e.nome, 'nome', qui, LIMITI.nome, true), serie: [], recupero: '', nota: '' };
      if (es.nome) qui += ' ("' + es.nome + '")';
      es.recupero = campoTesto(e.recupero, 'recupero', qui, LIMITI.recupero, false);
      es.nota = campoTesto(e.nota, 'nota', qui, LIMITI.nota, false);

      const haSerie = e.serie !== undefined && e.serie !== null;
      const numero = haSerie && (typeof e.serie === 'number' || typeof e.serie === 'string') ? leggiIntero(String(e.serie), 1, MAX_SERIE) : null;
      if (haSerie && numero === null) {
        errori.push(qui + ': il campo "serie" deve essere un numero intero tra 1 e ' + MAX_SERIE + ' (trovato: ' + mostraValore(e.serie) + ').');
      }

      if (e.ripetizioni === undefined || e.ripetizioni === null) {
        errori.push(qui + ': manca il campo "ripetizioni".');
      } else if (Array.isArray(e.ripetizioni)) {
        // Lista: una voce per serie.
        if (!e.ripetizioni.length || e.ripetizioni.length > MAX_SERIE) {
          errori.push(qui + ': la lista "ripetizioni" deve avere da 1 a ' + MAX_SERIE + ' voci (ne ha ' + e.ripetizioni.length + ').');
        } else {
          e.ripetizioni.forEach(function (r, k) {
            es.serie.push(campoTesto(r, 'ripetizioni', qui + ', serie ' + (k + 1), LIMITI.ripetizioni, true));
          });
          if (numero !== null && numero !== e.ripetizioni.length) {
            errori.push(qui + ': "serie" vale ' + numero + ' ma la lista "ripetizioni" ha ' + e.ripetizioni.length +
              ' voci. Togli "serie" oppure fai coincidere i due numeri.');
          }
        }
      } else {
        // Testo unico: uguale per tutte le serie, serve il numero di serie.
        const rip = campoTesto(e.ripetizioni, 'ripetizioni', qui, LIMITI.ripetizioni, true);
        if (!haSerie) errori.push(qui + ': manca il campo "serie" (il numero di serie). Serve quando "ripetizioni" è un testo unico.');
        else if (numero !== null) for (let k = 0; k < numero; k++) es.serie.push(rip);
      }
      giorno.esercizi.push(es);
    });
  });

  return { errori: errori, scheda: errori.length ? null : scheda };
}

// Dal testo incollato o dal file alla scheda controllata.
function analizzaTestoScheda(testo) {
  let t = String(testo == null ? '' : testo).replace(/^﻿/, '').trim();
  // Tolgo l'eventuale cornice ```json ... ``` copiata da una chat.
  const cornice = t.match(/^```[a-zA-Z]*\s*([\s\S]*?)\s*```$/);
  if (cornice) t = cornice[1].trim();
  if (!t) return { errori: ['Non c\'è niente da controllare: incolla il testo della scheda o scegli un file.'], scheda: null };
  let oggetto;
  try {
    oggetto = JSON.parse(t);
  } catch (e) {
    const errori = ['Il testo non è un JSON valido. Controlla che non manchino virgole, virgolette o parentesi. (Dettaglio tecnico: ' + e.message + ')'];
    if (/[“”„«»]/.test(t)) {
      errori.push('Il testo contiene virgolette "curve" (“ ”): nel JSON servono le virgolette dritte ("). Capita quando il testo passa da un programma di scrittura.');
    }
    return { errori: errori, scheda: null };
  }
  return validaSchedaImportata(oggetto);
}

// Salva una scheda già controllata, collegando gli esercizi al catalogo per nome.
function importaSchedaValidata(s) {
  const scheda = {
    id: nuovoId('sch'), nome: s.nome, creataIl: new Date().toISOString(),
    giorni: s.giorni.map(function (g) {
      return {
        id: nuovoId('gio'), nome: g.nome,
        esercizi: g.esercizi.map(function (e) {
          return {
            id: nuovoId('ve'), esercizioId: ottieniOCreaEsercizio(e.nome).id,
            recupero: e.recupero, nota: e.nota,
            serie: e.serie.map(function (r) { return { ripetizioni: r }; })
          };
        })
      };
    })
  };
  dati.schede.push(scheda);
  if (!schedaPerId(dati.schedaAttivaId)) dati.schedaAttivaId = scheda.id;
  salva();
  return scheda;
}

function plurale(n, singolare, pluraleTesto) { return n + ' ' + (n === 1 ? singolare : pluraleTesto); }

   PARTE 2: INTERFACCIA
   Legge i dati, disegna la pagina e chiama le funzioni della Parte 1.

const elTestata = document.getElementById('testata');
const elVista = document.getElementById('vista');
const elAvviso = document.getElementById('avviso');
let rotta = { tab: 'allenamento' };
let timerAvviso = null;

// Rende sicuro un testo prima di inserirlo nell'HTML.
function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function avviso(testo, errore) {
  elAvviso.textContent = testo;
  elAvviso.className = errore ? 'errore' : '';
  elAvviso.hidden = false;
  clearTimeout(timerAvviso);
  timerAvviso = setTimeout(function () { elAvviso.hidden = true; }, errore ? 5000 : 2500);
}

// Avvisa se l'ultimo salvataggio non è riuscito.
function controllaSalvataggio() {

    if (localStorage.getItem(CHIAVE) !== JSON.stringify(dati)) throw new Error();
  } catch (e) {
    avviso('Attenzione: salvataggio non riuscito. La memoria del telefono potrebbe essere piena.', true);
  }
}

/* ---- Finestra di conferma / inserimento testo ----
   opzioni: titolo, testo, ok, pericolo, campo { etichetta, valore, segnaposto, suggerimenti }
   Restituisce una Promise: true/false per le conferme, testo/null per i campi. */
function apriFinestra(opzioni) {
  return new Promise(function (risolvi) {
    const precedente = document.activeElement;
    const velo = document.createElement('div');
    velo.className = 'velo';
    const campo = opzioni.campo;
    velo.innerHTML =
      '<div class="finestra" role="dialog" aria-modal="true" aria-labelledby="fin-titolo">' +
        '<h3 id="fin-titolo">' + esc(opzioni.titolo) + '</h3>' +
        (opzioni.testo ? '<p>' + esc(opzioni.testo) + '</p>' : '') +
        (campo ? '<label for="fin-campo">' + esc(campo.etichetta) + '</label>' +
          '<input type="text" id="fin-campo" maxlength="80" autocomplete="off" enterkeyhint="done" placeholder="' +
          esc(campo.segnaposto || '') + '" value="' + esc(campo.valore || '') + '">' +
          '<div class="suggerimenti" id="fin-sugg"></div>' : '') +
        '<button class="btn ' + (opzioni.pericolo ? 'pericolo pieno' : 'primario') + '" data-fin="ok">' + esc(opzioni.ok || 'Conferma') + '</button>' +
        '<button class="btn" data-fin="no">Annulla</button>' +
      '</div>';
    document.body.appendChild(velo);
    const input = velo.querySelector('#fin-campo');
    const sugg = velo.querySelector('#fin-sugg');

    function chiudi(esito) {
      document.removeEventListener('keydown', suTasto);
      velo.remove();
      if (precedente && precedente.focus && document.contains(precedente)) precedente.focus();
      risolvi(esito);
    }
    function conferma() {
      if (!campo) return chiudi(true);
      const valore = pulisciTesto(input.value);
      if (!valore) { avviso('Scrivi un nome: il campo è vuoto.', true); input.focus(); return; }
      chiudi(valore);
    }
    function suTasto(e) {
      if (e.key === 'Escape') chiudi(campo ? null : false);
      if (e.key === 'Enter' && campo) { e.preventDefault(); conferma(); }
    }
    velo.addEventListener('click', function (e) {
      const b = e.target.closest('button');
      if (e.target === velo) return chiudi(campo ? null : false);
      if (!b) return;
      if (b.dataset.fin === 'ok') conferma();
      else if (b.dataset.fin === 'no') chiudi(campo ? null : false);
      else if (b.dataset.sugg !== undefined) { input.value = b.dataset.sugg; sugg.innerHTML = ''; input.focus(); }
    });
    document.addEventListener('keydown', suTasto);
    if (campo) {
      if (campo.suggerimenti) {
        input.addEventListener('input', function () { sugg.innerHTML = htmlSuggerimenti(input.value); });
      }
      input.focus(); input.select();
    } else {
      velo.querySelector('[data-fin="no"]').focus();
    }
  });
}

function chiediConferma(titolo, testo, ok) {
  return apriFinestra({ titolo: titolo, testo: testo, ok: ok || 'Cancella', pericolo: true });
}

function chiediNome(titolo, etichetta, valore, segnaposto, suggerimenti) {
  return apriFinestra({ titolo: titolo, campo: { etichetta: etichetta, valore: valore, segnaposto: segnaposto, suggerimenti: suggerimenti } });
}

function htmlSuggerimenti(testo) {
  return suggerisciEsercizi(testo).map(function (e) {
    return '<button type="button" data-sugg="' + esc(e.nome) + '">' + esc(e.nome) +
      '<small>già nel catalogo: tocca per usarlo</small></button>';
  }).join('');
}

/* ---- Navigazione: l'indirizzo dopo # dice quale schermata mostrare ---- */

function leggiRotta() {
  const p = location.hash.replace(/^#/, '').split('/').map(decodeURIComponent);
  const r = { tab: ['allenamento', 'scheda', 'dati'].indexOf(p[0]) !== -1 ? p[0] : 'allenamento' };
  if (r.tab === 'scheda' && dati) {
    r.importa = p[1] === 'importa';
    r.scheda = p[1] && !r.importa ? schedaPerId(p[1]) : null;
    r.giorno = r.scheda && p[2] === 'g' && p[3] ? giornoPerId(r.scheda, p[3]) : null;
    r.nuovo = !!(r.giorno && p[4] === 'nuovo');
    r.voce = r.giorno && p[4] === 'e' && p[5] ? vocePerId(r.giorno, p[5]) : null;
  }
  return r;
}

function linkScheda(s) { return '#scheda/' + s.id; }
function linkGiorno(s, g) { return linkScheda(s) + '/g/' + g.id; }
function linkVoce(s, g, v) { return linkGiorno(s, g) + '/e/' + v.id; }

function vai(hash) {
  if (location.hash === hash) disegna(); else location.hash = hash;
}

function testata(titolo, indietro) {
  elTestata.innerHTML =
    (indietro ? '<a class="indietro" href="' + indietro + '" aria-label="Indietro">‹</a>' : '') +
    '<h1>' + esc(titolo) + '</h1>';
  document.title = titolo + ' · Palestra';
}

function disegna() {
  if (erroreCaricamento) return disegnaErrore();
  rotta = leggiRotta();
  document.querySelectorAll('#barra a').forEach(function (a) {
    if (a.dataset.tab === rotta.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (rotta.tab === 'dati') return vistaDati();
  if (rotta.tab === 'allenamento') return vistaAllenamento();
  if (rotta.voce) return vistaVoce();
  if (rotta.nuovo) return vistaNuovaVoce();
  if (rotta.giorno) return vistaGiorno();
  if (rotta.scheda) return vistaScheda();
  if (rotta.importa) return vistaImporta();
  return vistaSchede();
}

/* ---- Schermate ---- */

function disegnaErrore() {
  testata('Palestra');
  document.getElementById('barra').hidden = true;

/* ---- Esportazione: file da scaricare, oppure pannello di condivisione su iPhone ---- */

function eIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function scaricaFile(testo, nome) {
  const url = URL.createObjectURL(new Blob([testo], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = nome; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 1000);
}

function esportaBackup() {
  const prima = dati.ultimoBackup;
  const adesso = new Date();
  dati.ultimoBackup = adesso.toISOString();
  if (!salva()) { dati.ultimoBackup = prima; return; }
  const testo = testoBackup(), nome = nomeFileBackup(adesso);

  // Su iPhone il download diretto non è affidabile nell'app installata: uso "Condividi".
  if (eIOS() && navigator.share && navigator.canShare) {
    let file = null;
    try { file = new File([testo], nome, { type: 'application/json' }); } catch (e) { /* File non disponibile */ }
    if (file && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(function () {
        avviso('Backup esportato: ' + nome);
        disegna();
      }).catch(function (e) {
        // Esportazione non avvenuta: la data dell'ultimo backup torna quella di prima.
        dati.ultimoBackup = prima; salva(); disegna();
        avviso(e && e.name === 'AbortError' ? 'Esportazione annullata: nessun backup fatto.' : 'Condivisione non riuscita: nessun backup fatto.', true);
      });
      return;
    }
  }
  scaricaFile(testo, nome);
  avviso('Backup scaricato: ' + nome);
}

async function proponiBackup(testo) {
  const esito = analizzaTestoBackup(testo);
  if (!esito.dati) { erroriBackup = esito.errori; disegna(); return; }
  erroriBackup = null;
  const ok = await apriFinestra({
    titolo: 'Sostituire tutti i dati?',
    testo: 'Il backup contiene: ' + contaDati(esito.dati) + '. I dati attuali (' + contaDati(dati) +
      ') verranno sostituiti. Ne conservo una copia che puoi ripristinare da questa sezione.',
    ok: 'Sostituisci tutti i dati', pericolo: true
  });
  if (ok) {
    if (sostituisciDati(esito.dati)) avviso('Backup importato.');
    else avviso('Importazione non riuscita: memoria del telefono piena. I dati attuali non sono stati toccati.', true);
  }
  disegna();
}

  'voce-cancella': async function () {
    const ok = await chiediConferma('Togliere l\'esercizio?',
      '"' + nomeEsercizio(rotta.voce.esercizioId) + '" verrà tolto da questo giorno. Lo storico dell\'esercizio non cambia.', 'Togli');
    if (ok) { cancellaVoce(rotta.giorno, rotta.voce); vai(linkGiorno(rotta.scheda, rotta.giorno)); }
  },
  'voce-sposta': function (b) { spostaVoce(rotta.giorno, b.dataset.id, Number(b.dataset.dir)); },

  'serie-genera': async function () {
    const v = rotta.voce;
    const n = leggiIntero(document.getElementById('rap-n').value, 1, MAX_SERIE);
    const rip = pulisciTesto(document.getElementById('rap-rip').value);
    if (n === null) { avviso(MSG_SERIE, true); return false; }
    if (!rip) { avviso(MSG_RIP, true); return false; }
    // Chiedo conferma solo se si perde qualcosa: serie in meno o serie diverse tra loro.
    if (n < v.serie.length || !serieTutteUguali(v)) {
      const ok = await chiediConferma('Sostituire le serie?',
        'Le ' + v.serie.length + ' serie attuali (' + riassuntoSerie(v) + ') diventeranno ' + n + ' × ' + rip + '.', 'Sostituisci');
      if (!ok) return false;
    }
    generaSerie(v, n, rip);
  },
  'serie-aggiungi': function () {
    if (rotta.voce.serie.length >= MAX_SERIE) { avviso('Massimo ' + MAX_SERIE + ' serie per esercizio.', true); return false; }
    aggiungiSerie(rotta.voce);
  },
  'serie-togli': async function (b) {
    const v = rotta.voce, i = Number(b.dataset.i);
    if (v.serie.length <= 1) { avviso('Deve restare almeno una serie. Per eliminare l\'esercizio usa "Togli dal giorno".', true); return false; }
    const ok = await chiediConferma('Togliere la serie ' + (i + 1) + '?', 'Ripetizioni: ' + (v.serie[i].ripetizioni || '(vuoto)') + '.', 'Togli');
    if (!ok) return false;
    togliSerie(v, i);
  }
};

let azioneInCorso = false;
document.addEventListener('click', async function (e) {
  const b = e.target.closest('[data-az]');
  if (!b || azioneInCorso || b.closest('.velo')) return;
  const azione = AZIONI[b.dataset.az];
  if (!azione) return;
  azioneInCorso = true;
  const hashPrima = location.hash;
  try {
    const esito = await azione(b);
    // Ridisegno se l'azione è andata a buon fine e non ha già cambiato schermata.
    if (esito !== false && location.hash === hashPrima) disegna();
    if (dati) controllaSalvataggio();
  } finally {
    azioneInCorso = false;
  }
});

// Campi di testo: salvo a ogni tasto, senza ridisegnare (così non perdo il cursore).
document.addEventListener('input', function (e) {
  const el = e.target;
  if (el.id === 'nv-nome') { document.getElementById('nv-sugg').innerHTML = htmlSuggerimenti(el.value); return; }
  if (el.id === 'imp-testo') {
    // Se cambio il testo, l'esito del controllo precedente non vale più.
    bozzaImport = { testo: el.value, errori: null, scheda: null };
    document.getElementById('imp-esito').innerHTML = '';
    return;
  }
  if (!el.dataset || !el.dataset.campo || !rotta.voce) return;
  if (el.dataset.campo === 'rip') modificaSerie(rotta.voce, Number(el.dataset.i), el.value);
  else modificaCampoVoce(rotta.voce, el.dataset.campo, el.value);
  controllaSalvataggio();
});

// Suggerimenti nella schermata "Nuovo esercizio".
elVista.addEventListener('click', function (e) {
  const b = e.target.closest('#nv-sugg [data-sugg]');
  if (!b) return;
  document.getElementById('nv-nome').value = b.dataset.sugg;
  document.getElementById('nv-sugg').innerHTML = '';
  document.getElementById('nv-serie').focus();
});

// Importazione: lettura del file scelto.
document.addEventListener('change', function (e) {
  if (e.target.id === 'bk-file' && e.target.files && e.target.files[0]) {
    const lettoreBackup = new FileReader();
    lettoreBackup.onload = function () { proponiBackup(String(lettoreBackup.result)); };
    lettoreBackup.onerror = function () { avviso('Non riesco a leggere il file scelto.', true); };
    lettoreBackup.readAsText(e.target.files[0]);
    return;
  }
  if (e.target.id !== 'imp-file' || !e.target.files || !e.target.files[0]) return;
  const file = e.target.files[0];
  if (file.size > 1000000) { avviso('File troppo grande per essere una scheda (più di 1 MB).', true); return; }
  const lettore = new FileReader();
  lettore.onload = function () { controllaImport(String(lettore.result)); };
  lettore.onerror = function () { avviso('Non riesco a leggere il file scelto.', true); };
  lettore.readAsText(file);
});

window.addEventListener('hashchange', function () { erroriBackup = null; disegna(); window.scrollTo(0, 0); });

// Se i dati cambiano in un'altra scheda del browser, li ricarico.
window.addEventListener('storage', function (e) {
  if (e.key === CHIAVE || e.key === null) { carica(); disegna(); }
});

/* ---- App installabile: funzionamento offline e aggiornamenti ---- */

// Scrive nella sezione Dati quale versione dell'app è sul telefono.
function mostraVersione() {
  if (!window.caches) return;
  caches.keys().then(function (nomi) {
    const el = document.getElementById('versione-app');
    const versioni = nomi.filter(function (n) { return n.indexOf('palestra-v') === 0; })
      .map(function (n) { return Number(n.slice(10)); }).sort(function (a, b) { return a - b; });
    if (el && versioni.length) el.textContent = 'Versione dell\'app: ' + versioni[0] + '. Disponibile senza connessione.';
  }).catch(function () {});
}

function avviaServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  const pulsante = document.getElementById('aggiorna');
  let registrazione = null;
  let ricaricata = false;

  function proponi() { pulsante.hidden = false; }

  navigator.serviceWorker.register('sw.js').then(function (reg) {
    registrazione = reg;
    // Una nuova versione è già pronta e aspetta.
    if (reg.waiting && navigator.serviceWorker.controller) proponi();
    reg.addEventListener('updatefound', function () {
      const nuovo = reg.installing;
      if (!nuovo) return;
      nuovo.addEventListener('statechange', function () {
        if (nuovo.state === 'installed' && navigator.serviceWorker.controller) proponi();
      });
    });
  }).catch(function () { /* senza service worker l'app funziona lo stesso, ma solo online */ });

  pulsante.addEventListener('click', function () {
    if (registrazione && registrazione.waiting) registrazione.waiting.postMessage('aggiorna');
    else location.reload();
  });

  // Quando la nuova versione prende il controllo, ricarico la pagina una volta sola.
  // (Alla prima installazione non c'era nessuna versione prima: niente ricarica.)
  let controllata = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!controllata) { controllata = true; return; }
    if (ricaricata) return;
    ricaricata = true;
    location.reload();
  });

  // Ogni volta che riapro l'app controllo se c'è una versione nuova.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && registrazione) registrazione.update().catch(function () {});
  });
}

carica();
disegna();
avviaServiceWorker();
// Chiedo al telefono di non cancellare i dati quando ha poco spazio.
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
</script>
